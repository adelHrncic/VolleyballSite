<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volleyball Site Admin</title>
    <style>
      :root {
        --bg: #050914;
        --panel: #0f172a;
        --line: rgba(255,255,255,0.12);
        --accent: #3d5bff;
        --text: #ecf3ff;
        --muted: #b7c7e6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #142447 0%, var(--bg) 60%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .admin-shell {
        width: min(460px, 100%);
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.92);
        box-shadow: 0 24px 70px rgba(0,0,0,0.35);
        padding: 2rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        margin-bottom: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.7), rgba(255,255,255,0) 40%), #3d5bff;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
        line-height: 1.6;
      }
      .link-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
      }
      a {
        color: var(--text);
        text-decoration: none;
      }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Site Admin</span>
      </div>
      <p>This editor is powered by Decap CMS. Sign in with GitHub to update the site content, rewrite copy, and upload new images without touching the code.</p>
      <p>Changes are committed directly to the repository, and your host rebuilds from there.</p>
      <div id="nc-root"></div>
      <div class="link-row">
        <a href="../">Back to site</a>
        <a href="https://decapcms.org/docs/intro/" target="_blank" rel="noreferrer">Decap docs</a>
      </div>
    </div>

    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
  </body>
</html>
